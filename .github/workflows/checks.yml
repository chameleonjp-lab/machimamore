name: Unit, build and UI checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run evidence:source
      - run: npm test
      - run: npm run build
      - run: npm run check:dist
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Real boss simulation and WebGL scene
        if: ${{ !cancelled() }}
        run: npx playwright test --config playwright.gameplay.config.ts browser-tests/boss-gameplay.spec.ts --reporter=line --output=test-results/boss-gameplay
      - run: npx playwright test --config playwright.gameplay.config.ts browser-tests/game-flow.spec.ts --grep camera-contract --project chromium --reporter=line --output=/tmp/machimamore-camera-contract-chromium
      - run: npx playwright test --config playwright.gameplay.config.ts browser-tests/game-flow.spec.ts --grep camera-contract --project webkit --reporter=line --output=/tmp/machimamore-camera-contract-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            test-results/
            artifacts/
            dist/artifact-manifest.json
          retention-days: 14
